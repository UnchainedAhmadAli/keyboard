name: Build Android keyboard
on:
  push:
    branches: [main, 'claude/**']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk HappyKeys.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HappyKeys-apk
          path: HappyKeys.apk
      - name: Publish release (main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Happy Keys for Android
          body: Download HappyKeys.apk on your Android phone and install it.
          files: HappyKeys.apk
          make_latest: true
